app = "devpulse"

kill_signal = "SIGTERM"
kill_timeout = 5
processes = []

[build]
  builder = "paketobuildpacks/builder-jammy-base"

[env]
  NODE_ENV = "production"
  PORT = "4000"
  # DevPulse 2.0 — AI service. Set AI_SERVICE_TOKEN and AI_API_KEY via `fly secrets set`.
  AI_SERVICE_URL = "http://devpulse-ai.fly.dev"
  AI_PROVIDER = "openai-compatible"
  AI_MODEL = "gpt-4o-mini"
  AI_DEEP_MODEL = "gpt-4o"
  AI_MAX_TOOL_CALLS = "25"
  VERIFY_SAMPLE_MINUTES = "60"
  VERIFY_FAILURE_DROP_RATIO = "0.3"

[experimental]
  auto_rollback = true

[[services]]
  protocol = "tcp"
  internal_port = 4000
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    path = "/api/health"
    method = "GET"

  [[services.concurrency]]
    type = "connections"
    hard_limit = 25
    soft_limit = 20
