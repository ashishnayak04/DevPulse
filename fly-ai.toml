# DevPulse AI service — Fly.io app configuration.
# Deploy as its own app alongside the main DevPulse app (see fly.toml):
#   fly launch --config fly-ai.toml --no-deploy
#   fly deploy --config fly-ai.toml
app = "devpulse-ai"

[experimental]
  auto_rollback = true

[env]
  AI_SERVICE_PORT = "8000"
  NODE_API_URL = "http://devpulse.fly.dev"

[[services]]
  protocol = "tcp"
  internal_port = 8000
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    path = "/healthz"
    method = "GET"

  [[services.concurrency]]
    type = "connections"
    hard_limit = 25
    soft_limit = 20