services:
  - type: web
    name: devpulse
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm run db:migrate:deploy && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: devpulse-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: devpulse-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM_NAME
        value: DevPulse Alerts
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://devpulse.onrender.com
      - key: PORT
        value: "4000"
      # DevPulse 2.0 — AI service (same shared token on both services)
      - key: AI_SERVICE_URL
        value: https://devpulse-ai.onrender.com
      - key: AI_SERVICE_TOKEN
        sync: false
      - key: AI_PROVIDER
        value: openai-compatible
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: AI_DEEP_MODEL
        value: gpt-4o
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_MAX_TOOL_CALLS
        value: "25"
      # DevPulse 2.0 — GitHub intelligence (optional)
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_HOOK_SECRET
        sync: false
      # DevPulse 2.0 — Fix verification
      - key: VERIFY_SAMPLE_MINUTES
        value: "60"
      - key: VERIFY_FAILURE_DROP_RATIO
        value: "0.3"

  - type: web
    name: devpulse-ai
    runtime: docker
    plan: free
    dockerfilePath: ai-service/Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: AI_SERVICE_PORT
        value: "8000"
      - key: AI_SERVICE_TOKEN
        sync: false
      - key: AI_PROVIDER
        value: openai-compatible
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: AI_DEEP_MODEL
        value: gpt-4o
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_MAX_TOOL_CALLS
        value: "25"
      - key: NODE_API_URL
        value: https://devpulse.onrender.com

databases:
  - name: devpulse-db
    plan: free
    region: ohio

redis:
  - name: devpulse-redis
    plan: free
    region: ohio