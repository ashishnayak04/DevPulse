services:
  - type: web
    name: devpulse
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm run db:migrate:deploy && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: devpulse-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: devpulse-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM_NAME
        value: DevPulse Alerts
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://devpulse.onrender.com
      - key: PORT
        value: "4000"

databases:
  - name: devpulse-db
    plan: free
    region: ohio

redis:
  - name: devpulse-redis
    plan: free
    region: ohio
